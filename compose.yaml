x-app:
  name: Seafile
  title: Seafile
  description: |
    Seafile is an open source file sync and share platform, focusing on reliability and performance. 
    Seafile's built-in collaborative document SeaDoc, make it easy for collaborative writing and publishing documents.
  url: https://www.seafile.com/
  category: it
  icon: icon.png
  author: Koen Swings  # Who created this compose file? (not the app ;-)
networks:
  seafile-net:
services:
  db:
    image: mariadb:10.11
    container_name: seafile-mysql
    restart: no
    environment:
      # ${pass} is generated per instance into .env by the Engine (idea#123).
      - MYSQL_ROOT_PASSWORD=${pass}
      - MYSQL_LOG_CONSOLE=true
      - MARIADB_AUTO_UPGRADE=1
    volumes:
      #- /opt/seafile-mysql/db:/var/lib/mysql    # Required, specifies the path to MySQL data persistent store.
      # MariaDB gets its OWN folder. It used to share ./data with Seafile, and MariaDB's entrypoint
      # chowns its whole datadir to uid 999 on every (re)create, which made Seafile 11 refuse to
      # start ("root is not the owner of /shared/seafile/seafile-data", HTTP 502). See MIGRATION.md.
      - ./data/db:/var/lib/mysql
    networks:
      - seafile-net
  memcached:
    image: memcached:1.6.18
    container_name: seafile-memcached
    restart: no
    entrypoint: memcached -m 256
    networks:
      - seafile-net
  seafile:
    image: seafileltd/seafile-mc:11.0-latest
    #image: koenswings/kolibri:1.0-0.15.5-dev
    #image: koenswings/kolibri:latest_dev
    restart: no
    pull_policy: never
    container_name: seafile
    ports:
      - ${port}:80
#     - 443:443  # If https is enabled, cancel the comment.
    volumes:
      #- /opt/seafile-data:/shared               # Required, specifies the path to Seafile data persistent store.
      - ./data/shared:/shared                    # Seafile data, never touched by MariaDB (MIGRATION.md).
    environment:
      - DB_HOST=db
      - DB_ROOT_PASSWD=${pass}                   # Must match MYSQL_ROOT_PASSWORD (idea#123).
      - TIME_ZONE=Etc/UTC                        # Optional, default is UTC. Should be uncomment and set to your local time zone.
      # Neutral placeholder — not a personal address (idea#123).
      - SEAFILE_ADMIN_EMAIL=admin@idea.local
      # IDEA default <account name>911! -> admin911! (easy to type; change before real use).
      # IDEA_SEAFILE_ADMIN_PASSWORD overrides it. The DB password stays the generated ${pass}.
      - SEAFILE_ADMIN_PASSWORD=${IDEA_SEAFILE_ADMIN_PASSWORD:-admin911!}
      - SEAFILE_SERVER_LETSENCRYPT=false         # Whether to use https or not.
      - SEAFILE_SERVER_HOSTNAME=docs.seafile.com # Specifies your host name if https is enabled.
    depends_on:
      - db
      - memcached
    networks:
      - seafile-net
